version: '3.8'

services:
  solarburst-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: solarburst-platform
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgres://solarburst:isroxsm2026@postgres:5432/solarburst_db
      - PYTHON_SERVICE_URL=http://127.0.0.1:8000
      - PYTHON_EXEC=python3
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - solarburst-data:/app/backend/uploads
      - solarburst-results:/app/results

  postgres:
    image: postgres:15-alpine
    container_name: solarburst-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=solarburst
      - POSTGRES_PASSWORD=isroxsm2026
      - POSTGRES_DB=solarburst_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solarburst -d solarburst_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  solarburst-data:
  solarburst-results:
